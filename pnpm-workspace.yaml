packages:
  - "apps/*"
  - "packages/*"
  - "examples/*"

# Single source of truth for versions shared across the workspace.
# Reference with `"pkg": "catalog:"` in any workspace package.json.
catalog:
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  ai: ^7.0.154
  dexie: ^4.4.7
  react: ^19.2.4
  react-dom: ^19.2.4
  typescript: ^5.9.3
  vitest: ^4.1.12

# Explicit allow-list: dependency install scripts never run unless listed here.
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
